<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | TaskManager'">TaskManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>

<!-- ===== SIDEBAR FRAGMENT ===== -->
<div th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <span class="logo-icon">✦</span>
        TaskManager
    </div>

    <nav class="sidebar-nav">
        <span class="nav-label">Main</span>
        <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
            <span class="icon">⊞</span> Dashboard
        </a>

        <span class="nav-label">Work</span>
        <a th:href="@{/projects}" class="nav-item" th:classappend="${activePage == 'projects'} ? 'active' : ''">
            <span class="icon">◈</span> Projects
        </a>
        <a th:href="@{/tasks}" class="nav-item" th:classappend="${activePage == 'tasks'} ? 'active' : ''">
            <span class="icon">◻</span> Tasks
        </a>

        <span class="nav-label" sec:authorize="hasRole('ADMIN')">Admin</span>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/projects/add}" class="nav-item">
            <span class="icon">＋</span> New Project
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/tasks/create}" class="nav-item">
            <span class="icon">＋</span> New Task
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="user-info">
            <div class="user-avatar" sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">A</div>
            <div>
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role" sec:authorize="hasRole('ADMIN')">ADMIN</div>
                <div class="user-role" sec:authorize="hasRole('MEMBER')">MEMBER</div>
            </div>
        </div>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="logout-btn">
                <span>⇤</span> Logout
            </button>
        </form>
    </div>
</div>
<script>
const toggle = document.querySelector('.menu-toggle');
const sidebar = document.querySelector('.sidebar');
const overlay = document.querySelector('.sidebar-overlay');

toggle?.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
});

overlay?.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
});
</script>
</body>
</html>
