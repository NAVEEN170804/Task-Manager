<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Project')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}" th:with="activePage='projects'"></div>

    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="page-title">Edit Project</div>
                <div class="page-subtitle">Update project details</div>
            </div>
            <a th:href="@{/projects}" class="btn btn-outline">← Back</a>
        </div>

        <div class="content-area">
            <div th:if="${error}" class="alert alert-error">⚠ <span th:text="${error}"></span></div>

            <div class="card form-card">
                <form th:action="@{/projects/edit/{id}(id=${projectId})}" method="post" th:object="${projectRequest}">
                    <div class="form-group">
                        <label class="form-label">Project Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control"></textarea>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                        <div class="form-group">
                            <label class="form-label">Due Date</label>
                            <input type="date" th:field="*{dueDate}" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Priority</label>
                            <select th:field="*{priority}" class="form-control" required>
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"
                                        th:selected="${p == projectRequest.priority}">Priority</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes →</button>
                        <a th:href="@{/projects}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
