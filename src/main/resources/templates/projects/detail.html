<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Project Detail')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}" th:with="activePage='projects'"></div>

    <div class="main-content">
        <div class="topbar">
            <div>
                <div class="page-title" th:text="${project.name}">Project</div>
                <div class="page-subtitle">Project Details</div>
            </div>
            <div style="display:flex; gap:8px;">
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/projects/edit/{id}(id=${project.id})}" class="btn btn-outline">Edit</a>
                <a th:href="@{/projects}" class="btn btn-outline">← Back</a>
            </div>
        </div>

        <div class="content-area">
            <div th:if="${success}" class="alert alert-success">✓ <span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-error">⚠ <span th:text="${error}"></span></div>

            <!-- Project Info -->
            <div class="card" style="margin-bottom:24px;">
                <div class="detail-header">
                    <div>
                        <div class="detail-title" th:text="${project.name}">Project Name</div>
                        <div class="detail-meta">
                            <span th:classappend="${project.priority.name() == 'LOW'} ? 'badge-low' : (${project.priority.name() == 'MEDIUM'} ? 'badge-medium' : 'badge-high')"
                                  class="badge" th:text="${project.priority}">Priority</span>
                            <span>📅 Due: <strong th:text="${project.dueDate}">-</strong></span>
                        </div>
                    </div>
                </div>
                <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.6;" th:text="${project.description}">Description</p>

                <!-- Members Section -->
                <div style="margin-top:24px;">
                    <h3 style="font-size:0.85rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;">Team Members</h3>
                    <div class="members-list" th:if="${!project.members.isEmpty()}">
                        <div class="member-chip" th:each="member : ${project.members}">
                            <div class="mini-avatar" th:text="${#strings.substring(member.name, 0, 1).toUpperCase()}">A</div>
                            <span th:text="${member.name}">Member</span>
                            <span class="badge" th:classappend="${member.role.name() == 'ADMIN'} ? 'badge-admin' : 'badge-member'" 
                                  th:text="${member.role}" style="padding:1px 6px; font-size:0.65rem;">ROLE</span>
                        </div>
                    </div>
                    <p th:if="${project.members.isEmpty()}" style="color:var(--text-muted); font-size:0.85rem;">No members assigned yet.</p>
                </div>

                <!-- Assign User (ADMIN only) -->
                <div sec:authorize="hasRole('ADMIN')" style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
                    <h3 style="font-size:0.85rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px;">Assign Member</h3>
                    <form th:action="@{/projects/{pid}/assign(pid=${project.id})}" method="post" style="display:flex; gap:10px; align-items:flex-end;">
                        <div style="flex:1;">
                            <select name="userId" class="form-control" required>
                                <option value="">-- Select User --</option>
                                <option th:each="user : ${allUsers}" th:value="${user.id}" th:text="${user.name + ' (' + user.email + ')'}">User</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Assign →</button>
                    </form>
                </div>
            </div>

            <!-- Tasks in this project -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Tasks in this Project</h2>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/tasks/create}" class="btn btn-primary btn-sm">＋ Task</a>
                </div>
                <div th:if="${!project.members.isEmpty() or true}">
                    <!-- We'll just link to tasks filtered by project - show all tasks for now -->
                    <p style="color:var(--text-muted); font-size:0.85rem;">
                        View <a th:href="@{/tasks}">all tasks →</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
const toggle = document.querySelector('.menu-toggle');
const sidebar = document.querySelector('.sidebar');
const overlay = document.querySelector('.sidebar-overlay');

toggle?.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
});

overlay?.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
});
</script>
</body>
</html>
